[package]
name = "euterpe_desktop"
description = "The desktop platform: play any Euterpe device through an audio interface, with a control panel generated from its schema."
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[[bin]]
name = "euterpe-desktop"
path = "src/main.rs"

[dependencies]
euterpe_core = { path = "../euterpe_core" }
euterpe_offline = { path = "../euterpe_offline" }
euterpe_registry = { path = "../euterpe_registry" }
desktop_audio = { path = "../desktop_audio" }
eframe = "0.31"
rfd = "0.15"
