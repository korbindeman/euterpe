[package]
name = "demo_daisy"
description = "Firmware: any registered device on the Daisy Seed (EUTERPE_DEVICE at build time, demo.drive by default). Flash with `just flash-device <name>`."
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "demo_daisy"
test = false
bench = false

[dependencies]
euterpe_core = { path = "../../crates/euterpe_core" }
euterpe_daisy = { path = "../../crates/euterpe_daisy" }
euterpe_registry = { path = "../../crates/euterpe_registry" }
cortex-m-rt = "0.7"
panic-halt = "0.2.0"

[features]
# Stream cycle accounting over RTT: `just probe-run <device>`.
rtt = ["euterpe_daisy/rtt"]
