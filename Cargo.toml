[workspace]
resolver = "3"
members = [
    "crates/audio_app",
    "crates/dsp",
    "crates/desktop_audio",
    "crates/daisy_runtime",
    "crates/preamp",
    "crates/preamp_desktop",
    "crates/preamp_daisy",
    "crates/ir_embed",
    "crates/euterpe_core",
    "crates/euterpe_offline",
    "crates/euterpe_cli",
    "devices/demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Optimize for real-time audio in dev builds.
[profile.dev.package.dsp]
opt-level = 3

[profile.dev.package.micromath]
opt-level = 3

[profile.dev.package.preamp]
opt-level = 3

[profile.dev.package.preamp_desktop]
opt-level = 2

[profile.dev.package.euterpe_core]
opt-level = 3

[profile.dev.package.euterpe_offline]
opt-level = 3
