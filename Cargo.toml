[workspace]
resolver = "3"
members = [
    "crates/audio_app",
    "crates/dsp",
    "crates/desktop_audio",
    "crates/daisy_runtime",
    "crates/preamp",
    "crates/preamp_desktop",
    "crates/preamp_daisy",
    "crates/ir_embed",
    "crates/euterpe_core",
    "crates/euterpe_dsp",
    "crates/euterpe_macros",
    "crates/euterpe_offline",
    "crates/euterpe_cli",
    "crates/euterpe_bench",
    "crates/euterpe_registry",
    "crates/euterpe_desktop",
    "crates/euterpe_bench_qemu",
    "crates/euterpe_bench_daisy",
    "crates/euterpe_daisy",
    "devices/demo_daisy",
    "crates/euterpe_fixtures",
    "crates/euterpe_irs",
    "devices/demo",
    "devices/pedals",
    "devices/preamp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Lints for the Euterpe crates (opt in with `[lints] workspace = true`).
# Legacy crates keep clippy's defaults until they are migrated.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
# `cargo kani` sets cfg(kani) for the proof harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Real-time hygiene. These have no place anywhere in the toolkit.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "warn"
# Every allow/expect says why.
allow_attributes_without_reason = "warn"

# Pedantic lints that are noise in DSP code.
cast_precision_loss = "allow"     # usize/u32 -> f32 for sample counts is everywhere
many_single_char_names = "allow"  # x, y, a, b, k are the domain's own names
similar_names = "allow"           # x1/x2, b0/b1/b2
unreadable_literal = "allow"      # filter and polynomial coefficients
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"      # error enums are self-describing
missing_panics_doc = "allow"
needless_for_each = "allow"       # buf.iter_mut().for_each(..) is the house style for block loops
inline_always = "allow"           # deliberate on hot-path helpers; check with bench

# Optimize for real-time audio in dev builds.
[profile.dev.package.dsp]
opt-level = 3

[profile.dev.package.micromath]
opt-level = 3

[profile.dev.package.preamp]
opt-level = 3

[profile.dev.package.preamp_desktop]
opt-level = 2

[profile.dev.package.euterpe_core]
opt-level = 3

[profile.dev.package.euterpe_dsp]
opt-level = 3

[profile.dev.package.euterpe_pedals]
opt-level = 3

[profile.dev.package.euterpe_preamp]
opt-level = 3

[profile.dev.package.euterpe_offline]
opt-level = 3

[profile.dev.package.euterpe_fixtures]
opt-level = 3
