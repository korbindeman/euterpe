name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, check, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just check-format
      - run: just clippy
      - run: just check
      - run: just test

  bench:
    name: euterpe bench (QEMU Cortex-M7)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm libglib2.0-dev pkg-config
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Bench against the baseline
        run: just bench | tee bench.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: bench.json
